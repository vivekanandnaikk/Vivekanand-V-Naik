<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Selected automotive and embedded systems projects</title>
  <desc id="desc">Four projects: real-time 3D LiDAR object detection for ADAS, Raspberry Pi traffic sign recognition, a vehicle accident alert system, and secure radar data communication.</desc>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="#111318" stroke="#394150" stroke-width="2"/>
  <text x="34" y="48" fill="#54d6b5" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">AUTOMOTIVE &amp; EMBEDDED PROJECTS</text>
  <g font-family="Arial,sans-serif">
    <rect x="34" y="72" width="432" height="116" rx="12" fill="#191e26"/>
    <text x="54" y="102" fill="#f3f6fb" font-size="18" font-weight="700">Real-Time 3D LiDAR Object Detection</text>
    <text x="54" y="130" fill="#aab3c2" font-size="15">ADAS pipeline · BEV mapping · RGB projection</text>
    <text x="54" y="156" fill="#aab3c2" font-size="15">Improved object localization accuracy by 30%.</text>

    <rect x="494" y="72" width="432" height="116" rx="12" fill="#191e26"/>
    <text x="514" y="102" fill="#f3f6fb" font-size="18" font-weight="700">Traffic Sign Recognition System</text>
    <text x="514" y="130" fill="#aab3c2" font-size="15">Real-time detection and classification on Raspberry Pi</text>
    <text x="514" y="156" fill="#aab3c2" font-size="15">Live HMI feedback · Optimized image processing</text>

    <rect x="34" y="204" width="432" height="116" rx="12" fill="#191e26"/>
    <text x="54" y="234" fill="#f3f6fb" font-size="18" font-weight="700">Vehicle Accident Alert System</text>
    <text x="54" y="262" fill="#aab3c2" font-size="15">Collision detection · GPS and email notifications</text>
    <text x="54" y="288" fill="#aab3c2" font-size="15">Alcohol detection sensors for driver safety</text>

    <rect x="494" y="204" width="432" height="116" rx="12" fill="#191e26"/>
    <text x="514" y="234" fill="#f3f6fb" font-size="18" font-weight="700">Secure Radar Data Communication</text>
    <text x="514" y="262" fill="#aab3c2" font-size="15">Encrypted transmission for automotive radar data</text>
    <text x="514" y="288" fill="#aab3c2" font-size="15">Reliable communication · Secure data handling</text>
  </g>
</svg>
